[build-system]
requires = ["setuptools>=61", "wheel", "cffi>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor"
version = "0.1.0"
description = "A tensor library with C extensions for high-performance computing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Andrej Karpathy"},
    {name = "SermetPekin", email = "sermet.pekin@gmail.com"}
]
keywords = ["tensor", "numpy", "c-extensions", "performance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cffi>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "torch>=2.9.0",
    "build",
    "twine",
    "black",
    "isort",
    "mypy",
]
test = [
    "pytest>=8.4.2",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/SermetPekin/tensor"
Repository = "https://github.com/SermetPekin/tensor"
Issues = "https://github.com/SermetPekin/tensor/issues"

[tool.setuptools]
packages = ["tensor"]

[tool.setuptools.package-data]
tensor = ["*.so", "src/*.c", "src/*.h"]

[tool.pytest.ini_options]
testpaths = ["tensor/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
